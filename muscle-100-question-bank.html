}

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;padding:0 16px 56px}
.wrap{max-width:720px;margin:0 auto}
header{padding:32px 0 16px}
.eyebrow{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,7vw,44px);line-height:1.08;margin:8px 0}
.sub{color:var(--muted);margin:0}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.stats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:14px}
.stats b{font-weight:600;color:var(--accent)}
.track{height:6px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
.fill{height:100%;width:0;background:var(--accent);transition:width .25s}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.chip{font:600 14px var(--body);padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.chip:focus-visible,.btn:focus-visible,.opt:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin:14px 0}
.card.right{border-color:var(--good)} .card.wrong{border-color:var(--bad)}
.head{display:flex;gap:10px;align-items:center;justify-content:space-between}
.tag{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.num{font-family:var(--mono);font-size:13px;color:var(--muted)}
.q{font-weight:600;margin:10px 0 12px;font-size:18px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;min-width:0}
.opt:hover{border-color:var(--accent)}
.opt input{margin-top:5px;accent-color:var(--accent);flex:none}
.opt span{min-width:0;overflow-wrap:anywhere}
.opt.sel{background:var(--accent-soft);border-color:var(--accent)}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.opt.miss{border-style:dashed;border-color:var(--good)}
.btn{font:600 15px var(--body);padding:10px 18px;border-radius:8px;border:0;background:var(--accent);color:var(--bg);cursor:pointer;margin-top:12px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.why{margin-top:12px;padding:12px;border-radius:8px;background:var(--bg);font-size:16px}
.verdict{font-weight:700;margin-bottom:4px}.verdict.r{color:var(--good)}.verdict.w{color:var(--bad)}
.done{text-align:center;padding:24px 16px}
.done h2{font-family:var(--display);font-size:30px;margin:0 0 6px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.empty{color:var(--muted);text-align:center;padding:32px 0}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
